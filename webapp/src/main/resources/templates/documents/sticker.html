<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
        }
        .outer-border {
            width: 320px;
            border: 2px solid #000;
            padding: 4px;
            border-radius: 2px;
            position: relative;
        }
        .inner-border {
            border: 1px solid #000;
            padding: 15px;
            padding-bottom: 25px;
            position: relative;
            z-index: 10;
        }
        .watermark {
            position: absolute;
            top: 70px;
            left: 55px;
            width: 180px;
            height: 180px;
            border: 10px double #9ca3af;
            border-radius: 50%;
            z-index: -1;
            text-align: center;
            opacity: 0.2;
        }
        .watermark-inner {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 198px;
            height: 198px;
            border: 1px dashed #d1d5db;
            border-radius: 50%;
        }
        .watermark span {
            font-size: 40px;
            font-weight: bold;
            color: #6b7280;
            letter-spacing: 5px;
            line-height: 180px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #000;
        }
        .header p {
            margin: 0;
            font-size: 12px;
            font-weight: bold;
            color: #000;
        }
        .middle-section {
            width: 100%;
            margin-bottom: 25px;
        }
        .vehicle-info {
            width: 65%;
            float: left;
            font-size: 13px;
            color: #000;
        }
        .vehicle-info table {
            width: 100%;
            border-collapse: collapse;
        }
        .vehicle-info td {
            padding: 2px 0;
        }
        .qr-code {
            width: 30%;
            float: right;
            text-align: right;
        }
        .qr-code img {
            width: 70px;
            height: 70px;
            border: 1px solid #e5e7eb;
            padding: 4px;
            background: #f3f4f6;
        }
        .clear {
            clear: both;
        }
        .bottom-section {
            border-top: 1px solid #000;
            padding-top: 15px;
            font-size: 13px;
            color: #000;
        }
        .bottom-section table {
            width: 100%;
            border-collapse: collapse;
        }
        .bottom-section td {
            padding: 2px 0;
        }
        .sticker-number {
            margin-top: 10px;
            font-size: 14px;
            padding-top: 10px;
        }
        .label {
            display: inline-block;
            width: 100px;
        }
        .colon {
            float: right;
        }
        .value {
            font-weight: bold;
            padding-left: 5px;
        }
    </style>
</head>
<body>

    <div class="outer-border">
        <div class="inner-border">
            
            <div class="watermark">
                <div class="watermark-inner"></div>
                <span>NIC</span>
            </div>

            <div class="header">
                <h3>UndaWriter Insurance Limited</h3>
                <p>NATIONAL INSURANCE COMMISSION</p>
            </div>
            
            <div class="middle-section">
                <div class="vehicle-info">
                    <table>
                        <tr>
                            <td width="60">Car No. <span class="colon">:</span></td>
                            <td class="value" th:text="${motor.regNumber}">GT-1234-21</td>
                        </tr>
                        <tr>
                            <td>Make <span class="colon">:</span></td>
                            <td class="value" th:text="${#strings.arraySplit(motor.makeModel, ' ')[0]}">Toyota</td>
                        </tr>
                        <tr>
                            <td>Model <span class="colon">:</span></td>
                            <td class="value" th:text="${#strings.contains(motor.makeModel, ' ') ? #strings.substringAfter(motor.makeModel, ' ') : motor.year}">Camry</td>
                        </tr>
                        <tr>
                            <td>Body <span class="colon">:</span></td>
                            <td class="value" th:text="${motor.bodyType}">Sedan</td>
                        </tr>
                    </table>
                </div>

                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&amp;data=https://undawriter.com/verify" alt="QR Code" />
                </div>
                <div class="clear"></div>
            </div>

            <div class="bottom-section">
                <table>
                    <tr>
                        <td width="110">Inception Date <span class="colon">:</span></td>
                        <td class="value" style="text-transform: uppercase;" th:text="${#temporals.format(policy.startDate, 'dd MMM yyyy')}">01 JAN 2026</td>
                    </tr>
                    <tr>
                        <td>Expiry Date <span class="colon">:</span></td>
                        <td class="value" style="text-transform: uppercase;" th:text="${#temporals.format(policy.endDate, 'dd MMM yyyy')}">01 JAN 2027</td>
                    </tr>
                </table>
                <div class="sticker-number">
                    <span style="display:inline-block; width:110px;">Sticker Number <span class="colon">:</span></span>
                    <span class="value" style="font-family: monospace; letter-spacing: 1px;" th:text="${policy.nicStickerId}">12345</span>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
