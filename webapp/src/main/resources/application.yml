spring:
  application:
    name: undawriter-insure
  mail:
    protocol: smtps
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.gmail.com
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

undawriter:
  app:
    jwtSecret: QWt3YWFiYUluc3VyZVNlY3JldEtleUFrd2FhYmFJbnN1cmVTZWNyZXRLZXk=
    jwtExpirationMs: 86400000
  mail:
    from: info@meshlabstek.com

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

# Fallback basic DB config if no profile provides it
spring.datasource.url: jdbc:h2:mem:testdb
spring.datasource.driverClassName: org.h2.Driver
spring.datasource.username: sa
spring.datasource.password:
spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
